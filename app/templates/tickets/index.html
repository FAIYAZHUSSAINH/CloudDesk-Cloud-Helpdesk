{% extends 'base.html' %}{% block title %}Tickets{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">TICKET QUEUE</span><h1 class="fw-bold mt-2">{{ 'All tickets' if current_user.is_admin else 'My tickets' }}</h1><p class="text-secondary">Find requests by status, priority, or category.</p></div><a class="btn btn-primary" href="{{ url_for('tickets.create') }}">+ New ticket</a></div>
<form class="card p-3 mb-4" method="get"><div class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label small" for="status">Status</label><select id="status" name="status" class="form-select"><option value="">All statuses</option>{% for item in statuses %}<option {% if request.args.get('status') == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label small" for="priority">Priority</label><select id="priority" name="priority" class="form-select"><option value="">All priorities</option>{% for item in priorities %}<option {% if request.args.get('priority') == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label small" for="category">Category</label><select id="category" name="category" class="form-select"><option value="">All categories</option>{% for item in categories %}<option {% if request.args.get('category') == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="col-md-3"><button class="btn btn-primary w-100">Filter tickets</button></div></div></form><div class="card">{% include '_ticket_table.html' %}</div>
{% endblock %}
