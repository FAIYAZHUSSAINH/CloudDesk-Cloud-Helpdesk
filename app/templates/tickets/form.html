{% extends 'base.html' %}{% block title %}New ticket{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">SUPPORT REQUEST</span><h1 class="fw-bold mt-2">Create a ticket</h1><p class="text-secondary">Tell the IT team what happened and where.</p></div></div><div class="card form-card p-4 p-lg-5"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="title">Title</label><input class="form-control" id="title" name="title" maxlength="150" value="{{ request.form.get('title','') }}" placeholder="e.g. Wi-Fi not working in Lab 301" required></div><div class="mb-3"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="6" maxlength="10000" placeholder="Include the location, error message, and what you tried." required>{{ request.form.get('description','') }}</textarea></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category" required><option value="">Choose a category</option>{% for category in categories %}<option value="{{ category }}" {% if request.form.get('category') == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label" for="priority">Priority</label><select class="form-select" id="priority" name="priority" required><option value="">Choose a priority</option>{% for priority in priorities %}<option value="{{ priority }}" {% if request.form.get('priority') == priority %}selected{% endif %}>{{ priority }}</option>{% endfor %}</select></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Submit ticket</button><a class="btn btn-outline-secondary" href="{{ url_for('tickets.index') }}">Cancel</a></div></form></div>
{% endblock %}
