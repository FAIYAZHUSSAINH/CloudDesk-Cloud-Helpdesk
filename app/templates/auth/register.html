{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}
<div class="auth-wrap"><div class="mb-4"><span class="eyebrow">GET STARTED</span><h1 class="display-6 fw-bold mt-2">Create your account</h1><p class="text-secondary">Report an issue and follow it from start to finish.</p></div><div class="card p-4 p-lg-5"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="255" required></div><div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="12" required><div class="form-text">Use at least 12 characters.</div></div><button class="btn btn-primary w-100">Create account</button></form><p class="small text-secondary mt-4 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></div></div>
{% endblock %}
