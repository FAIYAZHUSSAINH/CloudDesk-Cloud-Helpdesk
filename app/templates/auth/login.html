{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block content %}
<div class="auth-wrap"><div class="mb-4"><span class="eyebrow">WELCOME BACK</span><h1 class="display-6 fw-bold mt-2">Sign in to your desk</h1><p class="text-secondary">Track requests and keep support moving.</p></div>
<div class="card p-4 p-lg-5"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email" class="form-control" autocomplete="email" required></div><div class="mb-4"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div><button class="btn btn-primary w-100">Log in</button></form><p class="small text-secondary mt-4 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></div>
{% endblock %}
